name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CGO_ENABLED: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod tidy

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: false

    - name: Generate go.sum
      run: go mod download && go mod tidy

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      env:
        CGO_ENABLED: 0
      with:
        version: latest
        args: --timeout=5m
        skip-cache: true
        skip-pkg-cache: true
        skip-build-cache: true
