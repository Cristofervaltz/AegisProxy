version: '3.8'

services:
  aegisproxy:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - PORT=:8080
      - TARGET_API=https://api.openai.com
      - STORE_TYPE=redis
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
